name: Remote Deployment
on:
  push:
    branches:
      - main # Only trigger on main branch pushes

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e # Exit immediately on error if any command fails
            
            # Navigate to project directory
            cd /home/support/web/godspeedoffers.com/public_html

            # Stash local changes to prevent merge conflicts
            git stash --include-untracked

            # Fetch the latest changes
            git fetch --all

            # Reset local branch to match remote main branch
            git reset --hard origin/main

            # Apply any stashed changes (optional, remove if not needed)
            git stash pop || echo "No stashed changes to apply"

            # Clear Laravel caches
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Set proper file permissions
            sudo chown -R www-data:www-data storage bootstrap/cache public
            sudo chmod -R 775 storage bootstrap/cache public
