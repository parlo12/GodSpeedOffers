name: Remote Deployment
on:
  push:
    branches:
      - master # Only trigger on master branch pushes

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e # Exit immediately on error
            cd /home/support/web/crmstaging.godspeedoffers.com/public_html
            git pull
            git reset --hard origin/master
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo chown -R www-data:www-data /home/support/web/crmstaging.godspeedoffers.com/public_html/storage
            sudo chown -R www-data:www-data /home/support/web/crmstaging.godspeedoffers.com/public_html/bootstrap/cache
            sudo chmod -R 775 /home/support/web/crmstaging.godspeedoffers.com/public_html/storage
            sudo chmod -R 775 /home/support/web/crmstaging.godspeedoffers.com/public_html/bootstrap/cache
            sudo chown -R www-data:www-data /home/support/web/crmstaging.godspeedoffers.com/public_html/storage
            sudo chown -R www-data:www-data /home/support/web/crmstaging.godspeedoffers.com/public_html/public
            sudo chmod -R 775 /home/support/web/crmstaging.godspeedoffers.com/public_html/public

